name: Github Pages

on:
  push:
    branches:
      - master  # Source code branch is `master`

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      # Use GitHub Actions' cache to cache dependencies on servers
      - uses: actions/cache@v1
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      # Use GitHub Deploy Action to build and deploy to Github
      - uses: jeffreytse/jekyll-deploy-action@v0.5.1
        with:
          provider: 'github'
          token: ${{ secrets.GITHUB_TOKEN }}  # Personal Access Token (PAT)
          repository: ''  # Default is the current repository
          branch: 'gh-pages'  # Default is gh-pages for github provider
          jekyll_src: './'  # Default is root directory
          jekyll_cfg: '_config.yml'  # Default is _config.yml
          jekyll_baseurl: ''  # For personal page, leave it empty
          cname: ''  # Default is to not use a CNAME
          actor: ''  # Default is GITHUB_ACTOR
